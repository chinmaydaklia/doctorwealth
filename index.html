  var line=el("div","v sm"); line.id="syncStatusLine"; line.textContent=(DEV.syncStatus&&DEV.syncStatus.t)||"Not synced yet on this device"; st.appendChild(line);
  st.appendChild(el("div","sub","Merging is record-by-record: the newer edit of each entry wins, deletions are remembered (tombstones), nothing is overwritten wholesale. Device clocks that are far off can still pick the wrong “newer” edit — keep automatic time on."));
  v.appendChild(st);

  /* Drive */
  var d=DEV.drive;
  var c1=el("div","card"); c1.style.marginTop="12px";
  c1.appendChild(el("div","k","☁ Google Drive (automatic)"));
  c1.appendChild(el("div","sub",d.enabled?("On · every ~90 s while open, on app open and after edits"+(d.lastSync?(" · last "+new Date(d.lastSync).toLocaleString()):"")):"Off. Encrypted copy in a private app-only Drive folder."));
  if(!driveOriginOk()) c1.appendChild(el("div","note warn","Drive sync needs the hosted https:// app (e.g. GitHub Pages) on both devices. It can’t work from a downloaded file:// copy."));
  var r1=el("div","btnrow"); r1.style.marginTop="8px";
  var b1=el("button","btn sm primary",d.enabled?"Sync now":"Set up"); b1.onclick=function(){ if(d.enabled) driveSync(true); else driveSetup(); };
  r1.appendChild(b1);
  if(d.enabled){ var b2=el("button","btn sm","Settings"); b2.onclick=driveSetup; r1.appendChild(b2);
    var b3=el("button","btn sm ghost","Forget passphrase here"); b3.onclick=function(){ SYNC_PASS=null; delete DEV.syncPass; devSave(); toast("Passphrase forgotten on this device"); }; r1.appendChild(b3); }
  c1.appendChild(r1); v.appendChild(c1);

  /* Nearby */
  var c2=el("div","card"); c2.style.marginTop="12px";
  c2.appendChild(el("div","k","⇆ Nearby (same Wi-Fi, no cloud)"));
  c2.appendChild(el("div","sub","Direct, encrypted WebRTC link between the two devices. Signalling is a code shown as a QR (scan with the other phone) or copied/shared. No server, works offline on the same network."));
  var b4=el("button","btn sm primary","Start nearby sync"); b4.style.marginTop="8px"; b4.onclick=nearbySync; c2.appendChild(b4);
  v.appendChild(c2);

  /* File handoff */
  var c3=el("div","card"); c3.style.marginTop="12px";
  c3.appendChild(el("div","k","⇩ Sync file (works everywhere)"));
  c3.appendChild(el("div","sub","Save a sync file here, open it on the other device with ‘Merge sync file’. Merges both ways if you then send one back."));
  var r3=el("div","btnrow"); r3.style.marginTop="8px";
  var b5=el("button","btn sm","Save sync file"); b5.onclick=function(){ exportSyncFile(false); };
  var b6=el("button","btn sm","Save encrypted"); b6.onclick=function(){ exportSyncFile(true); };
  var b7=el("button","btn sm primary","Merge sync file"); b7.onclick=importSyncFile;
  r3.appendChild(b5); r3.appendChild(b6); r3.appendChild(b7); c3.appendChild(r3);
  v.appendChild(c3);

  v.appendChild(el("div","note","Never synced: saved bank-statement passwords, backup slots, the audit log and this device’s sync settings. Sync only happens after you switch it on."));
}

function addStarterCategories(){
  function addMissing(list,set){ var n=0; for(var i=0;i<set.length;i++){ var exists=false;
    for(var j=0;j<list.length;j++){ if(String(list[j].name).toLowerCase()===set[i][0].toLowerCase()){ exists=true; if(list[j].archived){ list[j].archived=false; n++; } break; } }
    if(!exists){ list.push(cat(set[i][0],set[i][1],set[i][2])); n++; } } return n; }
  var n=addMissing(State.incomeCats,STARTER_INCOME)+addMissing(State.expenseCats,STARTER_EXPENSE);
  save("cat.starter",n); toast(n?(n+" categories added"):"You already have all the recommended categories"); render();
}
function storageInfo(){
  var used=0; try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); used+=(k.length+(localStorage.getItem(k)||"").length)*2; } }catch(e){}
  return used;
}

/* =========================================================================
   PWA extras: PNG icons drawn at runtime + optional service worker (sw.js)
   ========================================================================= */
function iconPng(size){
  try{
    var c=document.createElement("canvas"); c.width=size; c.height=size; var x=c.getContext("2d");
    x.fillStyle="#0b1d33"; roundRect(x,0,0,size,size,size*0.19); x.fill();
    var g=x.createLinearGradient(0,0,size,size); g.addColorStop(0,"#e6c272"); g.addColorStop(1,"#b5862f");
    x.fillStyle=g; x.font="bold "+Math.round(size*0.62)+"px Arial, sans-serif"; x.textAlign="center"; x.textBaseline="middle";
    x.fillText("₹",size/2,size*0.54);
    return c.toDataURL("image/png");
  }catch(e){ return null; }
}
function registerSW(){
  if(!("serviceWorker" in navigator)) return;
  if(!/^https?:$/.test(location.protocol)) return;
  try{ navigator.serviceWorker.register("sw.js").then(function(){},function(){}); }catch(e){}
}
/* =========================================================================
   PWA: install prompt + manifest (embedded) + iOS guide
   ========================================================================= */
var deferredPrompt=null;
window.addEventListener("beforeinstallprompt",function(e){ e.preventDefault(); deferredPrompt=e; });
/* topbar install button (#30): Android one-tap, iOS/desktop step-by-step */
function triggerInstall(){
  var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  var standalone=(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone;
  if(standalone){ toast("Already installed \u2014 you're running the app"); return; }
  if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt=null; return; }
  openModal(function(){
    var w=el("div");
    w.appendChild(el("h3",null,"Install DoctorWealth"));
    w.appendChild(el("p","sub","Add it to your home screen for full-screen, offline use."));
    if(isIOS){ w.appendChild(el("div","note","On iPhone/iPad (Safari): tap the Share button \u2191, scroll to \u2018Add to Home Screen\u2019, then Add.")); }
    else { w.appendChild(el("div","note","Open your browser menu (\u22EE or \u2026) and choose \u2018Install app\u2019 / \u2018Add to Home screen\u2019. If you don\u2019t see it, the app may already be installed.")); }
    var done=el("button","btn primary block","Got it"); done.style.marginTop="10px"; done.onclick=closeModal;
    w.appendChild(done);
    return w;
  });
}
function setupManifest(){
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="512" height="512" rx="96" fill="#0b1d33"/>'+
    '<text x="256" y="340" font-size="300" text-anchor="middle" fill="#d9b35a" font-family="Arial">\u20B9</text></svg>';
  /* URL-encoded UTF-8 data URI: avoids btoa(), which throws on the non-Latin1 rupee glyph in browsers */
  var icon="data:image/svg+xml,"+encodeURIComponent(svg);
  var here=location.href.split("#")[0].split("?")[0];
  var icons=[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any"}];
  var p192=iconPng(192), p512=iconPng(512);
  if(p192) icons.unshift({src:p192,sizes:"192x192",type:"image/png",purpose:"any maskable"});
  if(p512) icons.unshift({src:p512,sizes:"512x512",type:"image/png",purpose:"any maskable"});
  var manifest={ name:"DoctorWealth", short_name:"DoctorWealth", id:here, start_url:here, scope:here.replace(/[^\/]*$/,""), display:"standalone",
    background_color:"#0b1d33", theme_color:"#0b1d33", icons:icons };
  var blob=new Blob([JSON.stringify(manifest)],{type:"application/json"});
  var link=document.createElement("link"); link.rel="manifest"; link.href=URL.createObjectURL(blob);
  document.head.appendChild(link);
  var ic=document.createElement("link"); ic.rel="apple-touch-icon"; ic.href=iconPng(180)||icon; document.head.appendChild(ic);
}
function maybeInstallHint(){
  var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  var standalone=window.matchMedia && window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
  if(standalone) return;
  /* show a one-time banner via toast/modal on first dashboard visit */
  if(localStorage.getItem("dw_install_seen")) return;
  setTimeout(function(){
    openModal(function(){
      var w=el("div");
      w.appendChild(el("h3",null,"Install DoctorWealth"));
      w.appendChild(el("p","sub","Add it to your home screen to use it full-screen and offline."));
      if(isIOS){
        w.appendChild(el("div","note","On iPhone/iPad: tap the Share button, then \u2018Add to Home Screen\u2019."));
      } else if(deferredPrompt){
        var b=el("button","btn primary block","Install now");
        b.onclick=function(){ deferredPrompt.prompt(); deferredPrompt=null; closeModal(); };
        w.appendChild(b);
      } else {
        w.appendChild(el("div","note","Use your browser menu \u2192 \u2018Install app\u2019 or \u2018Add to Home Screen\u2019."));
      }
      var dismiss=el("button","btn ghost block","Maybe later"); dismiss.style.marginTop="10px";
      dismiss.onclick=function(){ localStorage.setItem("dw_install_seen","1"); closeModal(); };
      w.appendChild(dismiss);
      return w;
    }, true);
  }, 1400);
}

/* =========================================================================
   BOOTSTRAP
   ========================================================================= */
function boot(){
  devLoad();
  try{ loadState(); }
  catch(e){
    /* e.g. data written by a NEWER app version: never overwrite it */
    document.body.innerHTML="<div style='padding:24px;color:#e8eef7;font-family:sans-serif'><h2>Can't open your data</h2><p>"+esc(e.message)+"</p><p>Your data has not been changed.</p></div>";
    return;
  }
  setupManifest();
  registerSW();
  $("syncBtn").onclick=function(){ if(DEV.drive.enabled) driveSync(true); else route("sync"); };
  $("fyBtn").onclick=openFYPicker;
  $("searchBtn").onclick=openSearch;
  $("installBtn").onclick=triggerInstall;
  if(syncLoanCategories()) save("loan.categories");   /* give existing loans their EMI category */
  renderTabs();
  route("dashboard");
  maybeInstallHint();
  startSyncTimers();
  /* redraw charts on resize/orientation change */
  window.addEventListener("resize",function(){ if(CUR==="dashboard"||CUR==="investments"||CUR==="wealth") render(); });
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();
